services:
  ecosystem-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-ecosystem-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DatabaseProvider=Sqlite
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/theEcosystem.db
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-Change_This_Production_Secret_Key_Minimum_32_Bytes_2026!}
      - EcosystemFeatures__EnableAutoMigration=true
      - EcosystemFeatures__EnableSwagger=false
    volumes:
      - ecosystem_data:/app/data
      - ecosystem_uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  ecosystem_data:
  ecosystem_uploads:
